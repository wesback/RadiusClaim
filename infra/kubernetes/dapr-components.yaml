---
# State Store Component - Azure Blob Storage
# This component MUST be manually deployed because Radius recipes with
# resourceProvisioning: 'recipe' do NOT automatically project Kubernetes
# Dapr Component objects. The recipe provisions Azure resources only.
#
# Deployment: kubectl apply -f infra/kubernetes/dapr-components.yaml
# Namespace: Must match the application namespace (e.g., radiusclaim-azure-radiusclaim)
#
# Values are populated from the Radius stateStore recipe output.
# After deploying the Radius app, update the following:
#   - accountName: from recipe output (stateStoreAccountName)
#   - containerName: from recipe output (containerName)
#   - azureTenantId / azureClientId: from the same Microsoft Entra principal Radius uses
#   - azureClientSecret: from a Kubernetes secret such as:
#       kubectl create secret generic azure-entra-auth \
#         --from-literal=azureClientSecret='<client-secret>'
#     If your cluster uses workload identity, omit the azureClientSecret entry and make sure
#     the workload pods are federated to the same client ID instead.
#
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  # IMPORTANT: Update namespace to match your Radius app namespace
  # Format: <environment-namespace>-<application-name>
  # Example: radiusclaim-azure-radiusclaim
  namespace: radiusclaim-azure-radiusclaim
spec:
  type: state.azure.blobstorage
  version: v2
  metadata:
  - name: accountName
    # UPDATE THIS: Get from `rad resource show Applications.Dapr/stateStores statestore -a radiusclaim`
    # Or from Radius deployment output
    value: "REPLACE_WITH_STORAGE_ACCOUNT_NAME"
  - name: containerName
    value: "expense-state"
  - name: azureTenantId
    value: "REPLACE_WITH_AZURE_TENANT_ID"
  - name: azureClientId
    value: "REPLACE_WITH_AZURE_CLIENT_ID"
  - name: azureEnvironment
    value: "AZUREPUBLICCLOUD"
  - name: azureClientSecret
    secretKeyRef:
      name: azure-entra-auth
      key: azureClientSecret
---
# Pub/Sub Component - Azure Service Bus Topics
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: radiusclaim-azure-radiusclaim
spec:
  type: pubsub.azure.servicebus.topics
  version: v1
  metadata:
  - name: connectionString
    # UPDATE THIS: Get from Service Bus namespace authorization rule
    # Do NOT set namespaceName when using connectionString auth.
    secretKeyRef:
      name: pubsub-secrets
      key: connectionString
  - name: disableEntityManagement
    # Topic and subscription are pre-created by the recipe
    value: "true"
---
# Secret Store Component - Azure Key Vault
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: platform-secrets
  namespace: radiusclaim-azure-radiusclaim
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
  - name: vaultName
    # UPDATE THIS: Get from `rad resource show Applications.Dapr/secretStores platform-secrets -a radiusclaim`
    value: "REPLACE_WITH_VAULT_NAME"
  - name: azureTenantId
    value: "REPLACE_WITH_AZURE_TENANT_ID"
  - name: azureClientId
    value: "REPLACE_WITH_AZURE_CLIENT_ID"
  - name: azureEnvironment
    value: "AZUREPUBLICCLOUD"
  - name: azureClientSecret
    secretKeyRef:
      name: azure-entra-auth
      key: azureClientSecret
  # If using workload identity, omit azureClientSecret and bind the pods to the same client ID instead.
