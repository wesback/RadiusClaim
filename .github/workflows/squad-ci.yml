name: Squad CI
# dotnet project — configure build/test commands below

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          dotnet restore RadiusClaim.slnx --nologo
          dotnet build RadiusClaim.slnx --configuration Release --no-restore --nologo
          dotnet test RadiusClaim.slnx --configuration Release --no-build --nologo
